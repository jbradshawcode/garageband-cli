# Dev-only: `uv tool install pre-commit && pre-commit install`. No CI yet (#10): run the tests yourself.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^tests/fixtures/
      - id: check-added-large-files
        name: check for large test fixtures
        args: [--maxkb=2000]
        files: ^tests/fixtures/
  - repo: local
    hooks:
      - id: no-projects-or-audio
        name: no GarageBand projects or audio outside tests/fixtures/
        entry: GarageBand projects and audio stay out of the repo; test projects go under tests/fixtures/
        language: fail
        files: '(?i)(\.band/|\.(aif|aiff|aifc|wav|mp3|m4a|m4p|m4r|mp4|aac|caf|flac|ogg|opus|sdir)$)'
        exclude: '(?i)^tests/fixtures/'
