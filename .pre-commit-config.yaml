# Dev-only hooks; setup is in CLAUDE.md. Fixture files under tests/fixtures/ are left byte-exact.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: &fixtures '(?i)^tests/fixtures/'
      - id: end-of-file-fixer
        exclude: *fixtures
      - id: check-json
        exclude: *fixtures
      - id: check-toml
        exclude: *fixtures
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: *fixtures
      - id: check-added-large-files
        name: check for large test fixtures
        args: [--maxkb=2000]
        files: *fixtures
  - repo: local
    hooks:
      - id: no-projects-or-audio
        name: no GarageBand projects or audio outside tests/fixtures/
        entry: GarageBand projects and audio stay out of the repo; test projects go under tests/fixtures/
        language: fail
        types: []
        types_or: [file, symlink]
        files: '(?i)(\.band/|\.(aif|aiff|aifc|wav|mp3|m4a|m4p|m4r|mp4|aac|caf|flac|ogg|opus|sdir)$)'
        exclude: *fixtures
