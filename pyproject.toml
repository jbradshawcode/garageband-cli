[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gbcli"
version = "0.1.0"
description = "Read-only command-line inspector for GarageBand (.band) projects"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
gb = "gbcli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Fixtures stay byte-exact; Markdown code blocks are left as written.
extend-exclude = ["tests/fixtures", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# ruff format owns line length; long strings it cannot wrap are allowed.
ignore = ["E501"]
